# Native release execution is owned by an immutable reviewed release-trusted.yml.
name: Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    uses: tangle-network/frost-blueprint/.github/workflows/release-trusted.yml@ac0aea19f0934fd9255979b29d9968ce74f09181
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      source_sha: ${{ github.sha }}
